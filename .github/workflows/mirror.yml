name: mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (default is the latest release)
        required: false

permissions:
  contents: write
  packages: write

env:
  UPSTREAM: zincsearch/zincsearch
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can't write upstream changes to .github/workflows, so those syncs fail here.
      - run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: v
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:${tag#v}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${tag#v} already exists"
          fi
      - if: steps.v.outputs.skip != 'true'
        run: |
          mkdir -p dl ctx/linux/amd64 ctx/linux/arm64
          gh release download "${{ steps.v.outputs.tag }}" --repo "$UPSTREAM" -D dl \
            -p checksums.txt -p '*_linux_x86_64.tar.gz' -p '*_linux_arm64.tar.gz'
          (cd dl && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf dl/*_linux_x86_64.tar.gz -C ctx/linux/amd64 zincsearch
          tar -xzf dl/*_linux_arm64.tar.gz -C ctx/linux/arm64 zincsearch
          cp Dockerfile LICENSE COPYRIGHT ctx/
      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ inputs.tag == '' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Unofficial rebuild of ZincSearch ${{ steps.v.outputs.tag }} release binaries
